[package]
name = "cuview"
version = "0.1.0"
authors = ["Steven Dwy <yoplitein+git@gmail.com>"]
edition = "2024"

[lib]
name = "cuview"
path = "src/lib.rs"

[[bin]]
name = "cuview"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
glam = "0.33"
png = "0.18"
pollster = "1.0"
serde = "1.0"
serde_json = "1.0"
wgpu = "0.13"
zip = "8.0"

[dependencies.bytemuck]
version = "1.25"
features = ["derive", "extern_crate_alloc"]

[dependencies.clap]
version = "4.6"
features = ["derive"]

[dependencies.hematite-nbt]
version = "0.5"
features = ["serde"]
